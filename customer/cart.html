<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shopping Cart - Online Food Ordering</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/css/customer.css" />
</head>
<body>
  <header class="navbar">
    <h1>Cart</h1>
    <nav>
      <a href="home.html" class="nav-link">Home</a>
      <a href="menu.html" class="nav-link">Menu</a>
      <a href="cart.html" class="nav-link active">Cart</a>
      <a href="my-orders.html" class="nav-link">My Orders</a>
      <button id="logout-btn" class="btn secondary small">Logout</button>
    </nav>
  </header>
  <main>
    <section id="cart-section" class="customer-section">
      <h2>Your Cart</h2>
      <table id="cart-table" style="width:100%; border-collapse:collapse;">
        <thead>
          <tr><th>Item</th><th>Qty</th><th>Price</th><th>Subtotal</th><th>Action</th></tr>
        </thead>
        <tbody></tbody>
      </table>
      <p id="empty-cart" style="display:none;">Your cart is empty.</p>
      <p class="total">Total Items: <span id="total-count">0</span></p>
      <p class="total">Grand Total: ₹<span id="grand-total">0</span></p>
      <button id="checkout-btn" class="btn primary" disabled>Proceed to Checkout</button>
    </section>
  </main>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/cart.js"></script>
  <script>
    const user = Session.getCurrentUser();
    if (!user || user.type !== 'customer') { window.location.href = '../index.html'; }
    document.getElementById('logout-btn').addEventListener('click',()=>{ Session.clear(); window.location.href='../index.html'; });
    Cart.renderCart(user.id);
    document.getElementById('checkout-btn').addEventListener('click',()=>{ window.location.href='checkout.html'; });
  </script>
</body>
</html>
