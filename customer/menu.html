<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Food Menu - Online Food Ordering</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/css/customer.css" />
</head>
<body>
  <header class="navbar">
    <h1>Menu</h1>
    <nav>
      <a href="home.html" class="nav-link">Home</a>
      <a href="menu.html" class="nav-link active">Menu</a>
      <a href="cart.html" class="nav-link">Cart (<span id="cart-count">0</span>)</a>
      <a href="my-orders.html" class="nav-link">My Orders</a>
      <button id="logout-btn" class="btn secondary small">Logout</button>
    </nav>
  </header>
  <main>
    <section class="search-bar">
      <input type="text" id="search-input" placeholder="Search food..." />
      <button id="search-btn" class="btn primary">Search</button>
    </section>
    <section class="categories">
      <div id="category-buttons" class="btn-group"></div>
    </section>
    <section class="grid" id="menu-grid"></section>
    <p id="empty-state" style="display:none;">No food items match your search.</p>
  </main>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/menu.js"></script>
  <script src="../assets/js/cart.js"></script>
  <script>
    // Ensure logged in
    const user = Session.getCurrentUser();
    if (!user || user.type !== 'customer') { window.location.href = '../index.html'; }
    document.getElementById('cart-count').textContent = Cart.getCount(user.id);
    document.getElementById('logout-btn').addEventListener('click', () => { Session.clear(); window.location.href = '../index.html'; });
    Menu.renderMenuPage();
  </script>
</body>
</html>
