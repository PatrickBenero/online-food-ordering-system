<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Management - Admin</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/css/admin.css" />
</head>
<body>
  <header class="navbar"><h1>Order Management</h1></header>
  <nav class="admin-section">
    <a href="dashboard.html" class="nav-link">Dashboard</a>
    <a href="menu-management.html" class="nav-link">Menu Management</a>
    <a href="customers.html" class="nav-link">Customers</a>
    <a href="orders.html" class="nav-link active">Orders</a>
    <a href="reports.html" class="nav-link">Reports</a>
    <button id="logout-btn" class="btn secondary small">Logout</button>
  </nav>
  <main class="admin-section">
    <section id="order-mgmt"></section>
  </main>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/admin.js"></script>
  <script>
    const user = Session.getCurrentUser();
    if (!user || user.type !== 'admin') { window.location.href = 'login.html'; }
    document.getElementById('logout-btn').addEventListener('click',()=>{ Session.clear(); window.location.href='login.html'; });
    Admin.renderOrderManagement();
  </script>
</body>
</html>
